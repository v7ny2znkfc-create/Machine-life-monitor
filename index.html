<header><h1>Advance fiber. Machine life monitor</h1><div>Engineering & Management Monitoring • V1.2</div></header>

<main>
  <section id="homeView">
    <div class="row" style="justify-content:space-between">
      <div>
        <strong id="dataVer">Machine Data</strong>
        <div class="muted" id="dataSub">Loading…</div>
      </div>
      <button class="secondary" id="adminBtn" onclick="adminLogin()">Admin Login</button>
    </div>

    <div style="height:16px"></div>

    <div class="grid dashboard-grid">
      <button class="metric metric-btn" onclick="openList('all')">
        <span>Total Equipment</span><strong id="total">0</strong><small>View all machines</small>
      </button>
      <button class="metric metric-btn" onclick="openList('overdue')">
        <span>Overdue</span><strong id="overdue">0</strong><small>Needs attention</small>
      </button>
      <button class="metric metric-btn" onclick="openList('due30')">
        <span>Due Soon</span><strong id="due">0</strong><small>Upcoming due</small>
      </button>
      <button class="metric metric-btn" onclick="openList('normal')">
        <span>Normal</span><strong id="normal">0</strong><small>Within life period</small>
      </button>
    </div>

    <div style="height:16px"></div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0">Machine Monitoring</h2>
          <div class="muted">Open a status group or view the complete machine list.</div>
        </div>
        <button class="primary" onclick="openList('all')">See All Machines</button>
      </div>

      <div class="row adminOnly hidden" style="margin-top:12px">
        <button class="secondary" onclick="exportMaster()">Export machine-data.json</button>
        <button class="secondary" onclick="syncNow(true)">Sync from GitHub</button>
      </div>
    </div>
  </section>

  <section id="listView" class="hidden">
    <div class="row" style="justify-content:space-between">
      <button class="secondary" onclick="goHome()">← Dashboard</button>
      <button class="primary adminOnly hidden" onclick="addMachine()">+ Add Machine</button>
    </div>

    <div style="height:12px"></div>

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <div>
          <h2 id="listTitle" style="margin:0">All Machines</h2>
          <div class="muted" id="listSubtitle">Machine list</div>
        </div>
        <div class="muted" id="listCount"></div>
      </div>

      <div style="height:12px"></div>

      <div class="grid">
        <div>
          <label>Search</label>
          <input id="q" placeholder="Machine / PMR / Part Code" oninput="renderList()">
        </div>
        <div>
          <label>Status</label>
          <select id="filter" onchange="renderList()">
            <option value="all">All</option>
            <option value="overdue">Overdue</option>
            <option value="due30">Due Soon</option>
            <option value="normal">Normal</option>
          </select>
        </div>
      </div>

      <div id="list" style="margin-top:10px"></div>
    </div>
  </section>

  <section id="detailView" class="hidden">
    <div class="row" style="justify-content:space-between">
      <button class="secondary" onclick="backToList()">← Machine List</button>
      <button class="secondary" onclick="goHome()">Dashboard</button>
    </div>
    <div id="detail" class="card" style="margin-top:12px"></div>
    <div id="form" class="card hidden" style="margin-top:14px"></div>
  </section>
</main>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),now=()=>new Date().toISOString();
function addDays(s,n){let d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Number(n));return d.toISOString().slice(0,10)}
function days(a,b){return Math.floor((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function calc(x){if(x.lastChange&&x.life)x.nextDue=addDays(x.lastChange,x.life);if(x.nextDue){x.remain=days(today(),x.nextDue);x.status=x.remain<0?'overdue':x.remain<=30?'due30':'normal'}else x.status='normal';return x}

function data(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!Array.isArray(d)||!d.length)d=JSON.parse(JSON.stringify(SEED));d=d.map(calc);localStorage.setItem(KEY,JSON.stringify(d));return d}
function nextV(v){let m=String(v||'v1.0').match(/(\d+)\.(\d+)/),a=+(m?.[1]||1),b=+(m?.[2]||0);return `v${a}.${b+1}`}
function save(d,source){localStorage.setItem(KEY,JSON.stringify(d.map(calc)));let m=meta();m.version=nextV(m.version);m.updatedAt=now();m.source=source;localStorage.setItem(META,JSON.stringify(m));render()}

  a.forEach(x=>c[x.status]++);
  $('total').textContent=a.length;
  $('overdue').textContent=c.overdue;
  $('due').textContent=c.due30;
  $('normal').textContent=c.normal;
  updateHeaderMeta();
}

function statusLabel(s){
  return s==='overdue'?'🔴 Overdue':s==='due30'?'🟠 Due Soon':'🟢 Normal';
}
function remainLabel(x){
  if(x.remain==null)return '-';
  return x.remain<0?Math.abs(x.remain)+' days overdue':x.remain+' days remain';
}
function listTitleFor(status){
  if(status==='overdue')return ['Overdue','Machines already past due date'];
  if(status==='due30')return ['Due Soon','Machines due within the current alert window'];
  if(status==='normal')return ['Normal','Machines within the planned life period'];
  return ['All Machines','Complete machine list'];
}
function openList(status='all'){
  currentListStatus=status;
  $('filter').value=status;
  $('q').value='';
  $('homeView').classList.add('hidden');
  $('detailView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  renderList();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderList(){
  const d=data().filter(x=>!x.inactive);
  const q=($('q').value||'').toLowerCase().trim();
  const f=$('filter').value||currentListStatus||'all';
  currentListStatus=f;
  const [title,sub]=listTitleFor(f);
  $('listTitle').textContent=title;
  $('listSubtitle').textContent=sub;

  const ord={overdue:0,due30:1,normal:2};
  const rows=d.filter(x=>(!q||[x.name,x.masterCode,x.partCode,x.area].join(' ').toLowerCase().includes(q))&&(f==='all'||x.status===f))
    .sort((x,y)=>ord[x.status]-ord[y.status] || (x.remain??9999)-(y.remain??9999) || String(x.name).localeCompare(String(y.name)));

  $('listCount').textContent=rows.length+' items';
  $('list').innerHTML=rows.length?rows.map(x=>`
    <button class="item" onclick="detail(${x.row})">
      <div class="machine-row-main">
        <strong>${esc(x.name)}</strong>
        <span class="machine-row-sub">${remainLabel(x)}</span>
      </div>
      <span>${statusLabel(x.status)}</span>
    </button>`).join(''):'<div class="muted">No machines found.</div>';
  updateHeaderMeta();
}
function goHome(){
  currentDetailRow=null;
  $('detailView').classList.add('hidden');
  $('listView').classList.add('hidden');
  $('homeView').classList.remove('hidden');
  renderDashboard();
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToList(){
  $('detailView').classList.add('hidden');
  $('listView').classList.remove('hidden');
  renderList();
  window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
  if(!$('homeView').classList.contains('hidden')) renderDashboard();
  else if(!$('listView').classList.contains('hidden')) renderList();
  else if(currentDetailRow!=null) detail(currentDetailRow,false);
}
async function adminLogin(){if(admin){admin=false;render();return}let p=prompt('Admin PIN');if(p===null)return;let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)),h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');if(h===HASH){admin=true;render()}else alert('PIN incorrect')}

function detail(r,scroll=true){
  let x=data().find(v=>+v.row===+r); if(!x)return;
  currentDetailRow=+r;
  $('homeView').classList.add('hidden');
  $('listView').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  $('form').classList.add('hidden');

  const hist=(x.history||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('detail').innerHTML=`
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h2 style="margin:0">${esc(x.name)}</h2>
        <div class="muted">${esc(x.area||'')}</div>
      </div>
      <strong>${statusLabel(x.status)}</strong>
    </div>

    <div style="height:14px"></div>
    <div class="grid">
      <div class="kv"><span>Life Time</span><strong>${x.life??'-'} days</strong></div>
      <div class="kv"><span>Remain</span><strong>${remainLabel(x)}</strong></div>
      <div class="kv"><span>Next Due</span><strong>${x.nextDue||'-'}</strong></div>
      <div class="kv"><span>Last Change</span><strong>${x.lastChange||'-'}</strong></div>
      <div class="kv"><span>Master Code</span><strong>${esc(x.masterCode||'-')}</strong></div>
      <div class="kv"><span>Part Code</span><strong>${esc(x.partCode||'-')}</strong></div>
      <div class="kv"><span>Spare Status</span><strong>${esc(x.spare||'-')}</strong></div>
      <div class="kv"><span>Price</span><strong>${x.price==null?'-':'฿'+Number(x.price).toLocaleString()}</strong></div>
    </div>

    <div class="row adminOnly ${admin?'':'hidden'}" style="margin-top:14px">
      <button class="primary" onclick="replacement(${x.row})">Record Replacement</button>
      <button class="secondary" onclick="editMachine(${x.row})">Edit Machine</button>
    </div>

    <div style="height:16px"></div>
    <h3>Replacement / Maintenance History</h3>
    ${hist.length?hist.map(h=>`<div style="padding:9px 0;border-bottom:1px solid #edf2f7"><strong>${h.date}</strong><div>${esc(h.event||'Recorded')}</div></div>`).join(''):'<div class="muted">No history</div>'}
  `;
  updateHeaderMeta();
  if(scroll)window.scrollTo({top:0,behavior:'smooth'});
}
function formHTML(x,t){return `<h2>${t}</h2><div class="grid"><input id="n" placeholder="Machine name" value="${esc(x.name||'')}"><input id="life" type="number" placeholder="Life Time day" value="${x.life||''}"><input id="last" type="date" value="${x.lastChange||''}"><input id="mc" placeholder="Master Code" value="${esc(x.masterCode||'')}"><input id="pc" placeholder="Part Code" value="${esc(x.partCode||'')}"></div><div class="row" style="margin-top:12px"><button class="primary" onclick="saveForm()">Save</button></div>`}
function addMachine(){editRow=null;$('form').innerHTML=formHTML({},'Add Machine');$('form').classList.remove('hidden')}
function editMachine(r){editRow=+r;let x=data().find(v=>+v.row===+r);$('form').innerHTML=formHTML(x,'Edit Machine');$('form').classList.remove('hidden')}
function saveForm(){let d=data(),x=editRow==null?null:d.find(v=>+v.row===editRow),name=$('n').value.trim(),life=+$('life').value,last=$('last').value;if(!name||!life||!last)return alert('กรอก Name, Life Time, Last Change');if(!x){x={row:Math.max(...d.map(v=>+v.row||0))+1,history:[]};d.push(x)}Object.assign(x,{name,life,lastChange:last,masterCode:$('mc').value.trim(),partCode:$('pc').value.trim()});save(d,'Admin Edit');$('form').classList.add('hidden');detail(x.row)}
function replacement(r){let date=prompt('Replacement date',today());if(!date)return;let note=prompt('Remark','Change new part')||'Change';let d=data(),x=d.find(v=>+v.row===+r);x.history=x.history||[];x.history.push({date,event:note});x.lastChange=date;save(d,'Replacement Record');detail(r)}
function download(o,n){let b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function pack(){return {schema:SCHEMA,appVersion:'Advance fiber. Machine life monitor V1.2',exportedAt:now(),source:'Published Master Export',meta:meta(),machines:data()}}
function exportMaster(){if(admin)download(pack(),'machine-data.json')}
async function syncNow(manual=false){try{let r=await fetch(REMOTE+'?t='+Date.now(),{cache:'no-store'}),p=await r.json();if(p.schema!==SCHEMA||!Array.isArray(p.machines))throw 0;let local=meta(),remote=p.meta||{version:'v1.0'};if(manual||remote.version!==local.version){localStorage.setItem(KEY,JSON.stringify(p.machines.map(calc)));localStorage.setItem(META,JSON.stringify({...remote,source:'Published Master',updatedAt:p.exportedAt||remote.updatedAt||now()}))}render()}catch(e){render()}}
render();setTimeout(()=>syncNow(false),900);
</script></body></html>
